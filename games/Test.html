<html>
    <head>
        <title>Game Loop</title>
        <style>
            *{
                margin:0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <canvas id="canv">

        </canvas>
        <script src = "../engine/Vector2.js"></script>
        <script src = "../engine/Player.js"></script>
        <script src = "../engine/Input.js"></script>
        <script src = "../engine/Engine.js"></script>
        <script>

            let player = new Player(window.innerWidth/2, window.innerHeight/2, 60, 60, 3, 0, 0)
            let dashDir = 0
            let dashCurrent = 0
            let jumpCurrent = 0
            let dashCooldown = 0

            const gravity = 0.2
            const counterDash = 0.2
            const ground = window.innerHeight/2 + player.height

            function update(){
                // console.log(Input.keysDown)

                /*** Player movement using A/D or </>. ***/
                if (Input.keysDown.includes("ArrowRight") || Input.keysDown.includes("KeyD")) {
                    if (player.x + player.width < window.innerWidth){
                        if (dashCurrent == 0) {
                            player.x += player.vx
                            dashDir = 1
                        }
                    }
                } else if (Input.keysDown.includes("ArrowLeft") || Input.keysDown.includes("KeyA")) {
                    if (player.x > 0) {
                        if (dashCurrent == 0) {
                            player.x -= player.vx
                            dashDir = 2
                        }
                    }
                }

                /*** Player jump movement. ***/
                if (Input.keysDown.includes("Space")) {
                    if (jumpCurrent == 0){
                        player.vy = -5
                        player.y -= 1
                        jumpCurrent = 1
                    }
                }

                if (player.y + player.height < ground) {
                    player.y += player.vy
                    if (player.vy < 5) {
                        player.vy += gravity
                    }
                } else {
                    player.vy = 0
                    jumpCurrent = 0
                }

                /*** Player dash movement. ***/
                if (Input.keysDown.includes("ShiftLeft")) {
                    if (dashCurrent == 0 && dashCooldown == 0) {
                        if (["KeyA", "KeyD", "ArrowLeft", "ArrowRight"].some(sub => Input.keysDown.includes(sub))) {
                            player.dash = 10
                            dashCurrent = 1
                            dashCooldown = 100
                        }
                    }
                }

                if (player.dash > 0 || player.dash < 0) {
                    if (player.x - player.dash < 0 || player.x + player.width + player.dash > window.innerWidth || player.dash < 3) {
                        player.dash = 0
                        dashCurrent = 0
                    }
                    if (dashDir == 1) {
                        player.x += player.dash
                    } else {
                        player.x -= player.dash
                    }
                    player.dash -= counterDash
                }

                if (dashCooldown > 0) {
                    dashCooldown -= 1
                }
            }

            function draw(ctx){

                ctx.beginPath()
                ctx.rect(player.x, player.y, player.width, player.height)
                
                ctx.fillStyle = "pink"
                ctx.fill()

                ctx.beginPath()
                ctx.rect(0, window.innerHeight/2 + player.height, window.innerWidth, window.innerHeight/2 - player.height)

                ctx.fillStyle = "black"
                ctx.fill()

                ctx.beginPath()
                ctx.font = "bold 20px Arial"
                ctx.fillStyle = "white"
                ctx.textAlign = "center"

                ctx.fillText("Dash Cooldown", window.innerWidth/2, window.innerHeight/2 + 100)

                ctx.beginPath()
                ctx.rect(window.innerWidth/2 - 50, window.innerHeight/2 + 120, 100, 10)
                
                ctx.fillStyle = "gray"
                ctx.fill()

                ctx.beginPath()
                ctx.rect(window.innerWidth/2 - 48, window.innerHeight/2 + 122, 96 * (dashCooldown / 100), 6)

                ctx.fillStyle = "white"
                ctx.fill()
            }

            Engine.start()
            
        </script>
    </body>
</html>
