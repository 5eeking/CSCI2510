<html>
    <head>
        <title>Game Loop</title>
        <style>
            *{
                margin:0;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <canvas id="canv">

        </canvas>
        <script src = "Vector2.js"></script>
        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")

            let position = new Vector2(41, 41)
            let velocity = new Vector2(5, 5)

            let colors = ["red", "orange", "yellow", "green", "lime", "lightgreen", "blue", "teal", "cyan", "purple", "magenta", "pink"]
            let colorNum = 0

            function gameLoop(){
                update()
                draw()
                requestAnimationFrame(gameLoop)
            }

            function update(){

                if (position.x + 40 >= window.innerWidth || position.x - 40 <= 0) {
                    velocity.x *= -1
                    colorNum++
                    if (colorNum == colors.length) {
                        colorNum = 0
                    }
                }

                if (position.y + 40 >= window.innerHeight || position.y - 40 <= 0) {
                    velocity.y *= -1
                    colorNum++
                    if (colorNum == colors.length) {
                        colorNum = 0
                    }
                }

                position.x += velocity.x
                position.y += velocity.y

                /*
                if (position.y == 0 && position.x < window.innerWidth) {
                    position.x += 1
                }
                if (position.x == window.innerWidth && position.y < window.innerHeight) {
                    position.y += 1
                }
                if (position.y == window.innerHeight && position.x > 0) {
                    position.x -= 1
                }
                if (position.x == 0 && position.y > 0) {
                    position.y -= 1
                }
                */

            }

            function draw(){

                // Expand the size of the canvas.
                canvas.width = window.innerWidth
                canvas.height = window.innerHeight

                // Signaling to the context that I'm going to draw something.
                ctx.save()

                // Set the center of our object.
                ctx.translate(position.x, position.y)

                ctx.lineTo(-40, -40)
                ctx.lineTo(40, -40)
                ctx.lineTo(40, 40)
                ctx.lineTo(-40, 40)
                
                ctx.fillStyle = colors[colorNum]
                ctx.fill()

                // Signaling that I'm done drawing.
                ctx.restore()
            }

            requestAnimationFrame(gameLoop)
            
        </script>
    </body>
</html>
