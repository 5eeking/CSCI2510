<html>
    <head>
        <title>Drawing!</title>
    </head>
    <body>
        <canvas id="canv">

        </canvas>
        <script>
            let canvas = document.querySelector("#canv")
            let ctx = canvas.getContext("2d")

            // Expand the size of the canvas.
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight

            // Signaling to the context that I'm going to draw something.
            ctx.save()

            // Set the center of our object.
            ctx.translate(50, 75)

            ctx.lineTo(0, -30)
            ctx.lineTo(10, -25)
            ctx.lineTo(55, -60)
            ctx.lineTo(70, 20)
            ctx.lineTo(60, 15)
            ctx.lineTo(0, 30)
            

            ctx.fillStyle = "pink"
            ctx.fill()


            // Signaling that I'm done drawing.
            ctx.restore()
        </script>
    </body>
</html>
